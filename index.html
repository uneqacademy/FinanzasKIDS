<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="format-detection" content="telephone=no" />
  <title>Inversión Hijos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-box">
    <h1>Inversión Hijos</h1>
    <form id="loginForm">
      <input id="usuario" type="text" placeholder="Usuario" required autocomplete="username" />
      <input id="clave" type="password" placeholder="Clave" required minlength="6" autocomplete="current-password" />
      <button type="submit" class="boton-primario boton-ancho">Entrar</button>
    </form>
    <p id="resultado" class="error"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmbQvh1aP6HJ4cIfng_L0auwIq-4a1awA",
      authDomain: "finanzaskidsgb.firebaseapp.com",
      databaseURL: "https://finanzaskidsgb-default-rtdb.firebaseio.com",
      projectId: "finanzaskidsgb",
      storageBucket: "finanzaskidsgb.firebasestorage.app",
      messagingSenderId: "847408719363",
      appId: "1:847408719363:web:d9301376fef801e2259036"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const DOMINIO_FALSO = "inversion-hijos.local";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const usuario = document.getElementById("usuario").value.trim().toLowerCase();
      const clave = document.getElementById("clave").value;
      const resultado = document.getElementById("resultado");
      try {
        await signInWithEmailAndPassword(auth, `${usuario}@${DOMINIO_FALSO}`, clave);
        window.location.href = "inicio.html";
      } catch (err) {
        resultado.textContent = "Usuario o clave incorrectos";
      }
    });
  </script>
</body>
</html>
