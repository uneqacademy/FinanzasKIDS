<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Inversión Hijos</title>
</head>
<body>
  <h1>Inversión Hijos</h1>

  <form id="loginForm">
    <input id="usuario" type="text" placeholder="Usuario" required />
    <input id="clave" type="password" placeholder="Clave" required minlength="6" />
    <button type="submit">Entrar</button>
  </form>
  <p id="resultado" style="color:red;"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmbQvh1aP6HJ4cIfng_L0auwIq-4a1awA",
      authDomain: "finanzaskidsgb.firebaseapp.com",
      databaseURL: "https://finanzaskidsgb-default-rtdb.firebaseio.com",
      projectId: "finanzaskidsgb",
      storageBucket: "finanzaskidsgb.firebasestorage.app",
      messagingSenderId: "847408719363",
      appId: "1:847408719363:web:d9301376fef801e2259036"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const DOMINIO_FALSO = "inversion-hijos.local";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const usuario = document.getElementById("usuario").value.trim().toLowerCase();
      const clave = document.getElementById("clave").value;
      const resultado = document.getElementById("resultado");
      try {
        await signInWithEmailAndPassword(auth, `${usuario}@${DOMINIO_FALSO}`, clave);
        window.location.href = "inicio.html";
      } catch (err) {
        resultado.textContent = "Usuario o clave incorrectos";
      }
    });
  </script>
</body>
</html>
