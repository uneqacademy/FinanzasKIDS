<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Panel Admin</title>
</head>
<body>
  <h1>Panel Admin</h1>
  <p id="quien">Cargando...</p>

  <h2>Solicitudes pendientes</h2>
  <div id="pendientes">Cargando...</div>

  <h2>Definir tasa del período</h2>
  <form id="tasaForm">
    <label>
      Periodicidad:
      <select id="tipoPeriodo">
        <option value="30">Mensual (30 días)</option>
        <option value="15">Quincenal (15 días)</option>
      </select>
    </label>
    <br />
    <label>
      Tasa objetivo (%):
      <input id="tasaObjetivo" type="number" step="0.1" required />
    </label>
    <br />
    <button type="submit">Publicar tasa</button>
  </form>
  <p id="resultado"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getDatabase, ref, get, set, push, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
    import { generarFactoresDiarios, valorCuotaEnFecha, periodoParaFecha } from "./motor.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmbQvh1aP6HJ4cIfng_L0auwIq-4a1awA",
      authDomain: "finanzaskidsgb.firebaseapp.com",
      databaseURL: "https://finanzaskidsgb-default-rtdb.firebaseio.com",
      projectId: "finanzaskidsgb",
      storageBucket: "finanzaskidsgb.firebasestorage.app",
      messagingSenderId: "847408719363",
      appId: "1:847408719363:web:d9301376fef801e2259036"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let usuarioActual = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      const snap = await get(ref(db, `usuarios/${user.uid}`));
      const datos = snap.val();
      if (!datos || datos.rol !== "admin") {
        document.getElementById("quien").textContent = "No tienes permiso para ver esta página.";
        document.getElementById("tasaForm").style.display = "none";
        return;
      }
      usuarioActual = user;
      document.getElementById("quien").textContent = `Admin: ${user.email}`;
      await cargarPendientes();
    });

    async function valorCuotaHoy() {
      const snapPeriodos = await get(ref(db, "tasas_periodo"));
      const periodos = snapPeriodos.val() ? Object.values(snapPeriodos.val()) : [];
      const periodoHoy = periodoParaFecha(periodos, new Date());
      return periodoHoy ? valorCuotaEnFecha(periodoHoy, new Date()) : 1000;
    }

    async function cargarPendientes() {
      const contenedor = document.getElementById("pendientes");
      const snap = await get(ref(db, "movimientos"));
      const datos = snap.val() || {};

      const pendientes = [];
      for (const uid in datos) {
        for (const movId in datos[uid]) {
          const m = datos[uid][movId];
          if (m.estado === "Pendiente") {
            pendientes.push({ uid, movId, ...m });
          }
        }
      }

      if (pendientes.length === 0) {
        contenedor.textContent = "No hay solicitudes pendientes.";
        return;
      }

      contenedor.innerHTML = "";
      for (const p of pendientes) {
        const snapUsuario = await get(ref(db, `usuarios/${p.uid}`));
        const nombre = (snapUsuario.val() || {}).nombre || p.uid;

        const div = document.createElement("div");
        div.style.border = "1px solid #ccc";
        div.style.padding = "8px";
        div.style.marginBottom = "8px";
        div.innerHTML = `
          <strong>${nombre}</strong> — ${p.tipo} — $${p.monto.toLocaleString("es-CL")} — ${p.fecha}
          <br/>
          <button class="btnAprobar">Aprobar</button>
          <button class="btnRechazar">Rechazar</button>
        `;
        div.querySelector(".btnAprobar").addEventListener("click", () => procesar(p, "Aprobado"));
        div.querySelector(".btnRechazar").addEventListener("click", () => procesar(p, "Rechazado"));
        contenedor.appendChild(div);
      }
    }

    async function procesar(p, nuevoEstado) {
      if (nuevoEstado === "Aprobado") {
        const cuotaHoy = await valorCuotaHoy();
        const unidades = p.monto / cuotaHoy;
        const signo = p.tipo === "Aporte" ? 1 : -1;

        const snapUsuario = await get(ref(db, `usuarios/${p.uid}`));
        const actual = (snapUsuario.val() || {}).unidades_totales || 0;
        await update(ref(db, `usuarios/${p.uid}`), {
          unidades_totales: actual + signo * unidades,
        });
      }

      await update(ref(db, `movimientos/${p.uid}/${p.movId}`), {
        estado: nuevoEstado,
      });

      await cargarPendientes();
    }

    document.getElementById("tasaForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const dias = parseInt(document.getElementById("tipoPeriodo").value, 10);
      const tasaPorc = parseFloat(document.getElementById("tasaObjetivo").value);
      const tasaObjetivo = tasaPorc / 100;
      const resultado = document.getElementById("resultado");

      try {
        const snap = await get(ref(db, "tasas_periodo"));
        const periodos = snap.val() ? Object.values(snap.val()) : [];

        let valorInicial = 1000;
        let fechaInicio = new Date();

        if (periodos.length > 0) {
          const ultimo = periodos.reduce((a, b) =>
            new Date(a.fecha_fin) > new Date(b.fecha_fin) ? a : b
          );
          valorInicial = valorCuotaEnFecha(ultimo, new Date(ultimo.fecha_fin));
          fechaInicio = new Date(new Date(ultimo.fecha_fin).getTime() + 86400000);
        }

        const fechaFin = new Date(fechaInicio.getTime() + (dias - 1) * 86400000);
        const factores = generarFactoresDiarios(tasaObjetivo, dias);

        const nuevoPeriodo = {
          fecha_inicio: fechaInicio.toISOString().slice(0, 10),
          fecha_fin: fechaFin.toISOString().slice(0, 10),
          tipo: dias === 30 ? "Mensual" : "Quincenal",
          tasa_objetivo: tasaObjetivo,
          valor_inicial: valorInicial,
          factores,
          publicado_por: usuarioActual.uid,
        };

        const nuevaRef = push(ref(db, "tasas_periodo"));
        await set(nuevaRef, nuevoPeriodo);

        resultado.textContent = `¡Publicado! Del ${nuevoPeriodo.fecha_inicio} al ${nuevoPeriodo.fecha_fin}, empezando en $${valorInicial.toFixed(2)}.`;
        resultado.style.color = "green";
        e.target.reset();
      } catch (err) {
        resultado.textContent = `Error: ${err.message}`;
        resultado.style.color = "red";
      }
    });
  </script>
</body>
</html>
