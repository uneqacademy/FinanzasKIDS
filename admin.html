<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="format-detection" content="telephone=no" />
  <title>Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div style="text-align:right; margin-bottom: 10px;">
    <a href="#" id="btnCerrarSesion" class="link-muted">Cerrar sesión</a>
  </div>
  <p class="saludo" id="quien" style="margin-bottom: 24px;">Cargando...</p>

  <h2>Resumen de patrimonio</h2>
  <div class="grid-2" id="resumen"></div>

  <h2>Solicitudes pendientes</h2>
  <div id="pendientes" style="margin-bottom: 20px;">Cargando...</div>

  <h2>Definir tasa del período</h2>
  <div class="panel">
    <form id="tasaForm">
      <div class="campo">
        <label>Periodicidad</label>
        <select id="tipoPeriodo">
          <option value="30">Mensual (30 días)</option>
          <option value="15">Quincenal (15 días)</option>
        </select>
      </div>
      <div class="campo">
        <label>Tasa objetivo (%)</label>
        <input id="tasaObjetivo" type="number" step="0.1" required />
      </div>
      <button type="submit" class="boton-primario boton-ancho">Publicar tasa</button>
    </form>
    <p id="resultado" class="resultado-msg"></p>
  </div>

  <h2>Historial de tasas aplicadas</h2>
  <div class="panel" id="historialTasas">Cargando...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getDatabase, ref, get, set, push, update } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
    import { generarFactoresDiarios, valorCuotaEnFecha, periodoParaFecha } from "./motor.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmbQvh1aP6HJ4cIfng_L0auwIq-4a1awA",
      authDomain: "finanzaskidsgb.firebaseapp.com",
      databaseURL: "https://finanzaskidsgb-default-rtdb.firebaseio.com",
      projectId: "finanzaskidsgb",
      storageBucket: "finanzaskidsgb.firebasestorage.app",
      messagingSenderId: "847408719363",
      appId: "1:847408719363:web:d9301376fef801e2259036"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let usuarioActual = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      const snap = await get(ref(db, `usuarios/${user.uid}`));
      const datos = snap.val();
      if (!datos || datos.rol !== "admin") {
        document.getElementById("quien").textContent = "No tienes permiso para ver esta página.";
        document.getElementById("tasaForm").style.display = "none";
        return;
      }
      usuarioActual = user;
      document.getElementById("quien").textContent = `¡Hola ${datos.nombre || user.email}!`;
      await cargarPendientes();
      await cargarResumen();
      await cargarHistorialTasas();
    });

    async function valorCuotaHoy() {
      const snapPeriodos = await get(ref(db, "tasas_periodo"));
      const periodos = snapPeriodos.val() ? Object.values(snapPeriodos.val()) : [];
      const periodoHoy = periodoParaFecha(periodos, new Date());
      return periodoHoy ? valorCuotaEnFecha(periodoHoy, new Date()) : 1000;
    }

    async function cargarResumen() {
      const contenedor = document.getElementById("resumen");
      const snapUsuarios = await get(ref(db, "usuarios"));
      const usuarios = snapUsuarios.val() || {};

      const cuotaHoy = await valorCuotaHoy();

      const snapMov = await get(ref(db, "movimientos"));
      const movimientosPorUid = snapMov.val() || {};

      contenedor.innerHTML = "";
      for (const uid in usuarios) {
        const u = usuarios[uid];
        if (u.rol !== "hijo") continue;

        const patrimonio = (u.unidades_totales || 0) * cuotaHoy;
        const misMov = movimientosPorUid[uid] ? Object.values(movimientosPorUid[uid]) : [];
        const aprobados = misMov.filter((m) => m.estado === "Aprobado");
        const totalAportado = aprobados.reduce((acc, m) => {
          if (m.tipo === "Aporte") return acc + m.monto;
          if (m.tipo === "Retiro") return acc - m.monto;
          return acc;
        }, 0);

        const div = document.createElement("div");
        div.className = "metric-card";

        if (totalAportado === 0) {
          div.innerHTML = `
            <p class="nombre">${u.nombre || uid}</p>
            <p class="valor">$${Math.round(patrimonio).toLocaleString("es-CL")}</p>
            <p class="cambio neutra">Sin aportes aún</p>
          `;
        } else {
          const ganancia = patrimonio - totalAportado;
          const gananciaPct = (ganancia / totalAportado) * 100;
          const signo = ganancia >= 0 ? "+" : "";
          const clase = ganancia >= 0 ? "positiva" : "negativa";
          div.innerHTML = `
            <p class="nombre">${u.nombre || uid}</p>
            <p class="valor">$${Math.round(patrimonio).toLocaleString("es-CL")}</p>
            <p class="cambio ${clase}">${signo}${gananciaPct.toFixed(1)}%</p>
          `;
        }
        contenedor.appendChild(div);
      }
    }

    async function cargarPendientes() {
      const contenedor = document.getElementById("pendientes");
      const snap = await get(ref(db, "movimientos"));
      const datos = snap.val() || {};

      const pendientes = [];
      for (const uid in datos) {
        for (const movId in datos[uid]) {
          const m = datos[uid][movId];
          if (m.estado === "Pendiente") pendientes.push({ uid, movId, ...m });
        }
      }

      if (pendientes.length === 0) {
        contenedor.innerHTML = '<p class="texto-suave">No hay solicitudes pendientes.</p>';
        return;
      }

      contenedor.innerHTML = "";
      for (const p of pendientes) {
        const snapUsuario = await get(ref(db, `usuarios/${p.uid}`));
        const nombre = (snapUsuario.val() || {}).nombre || p.uid;

        const div = document.createElement("div");
        div.className = "solicitud";
        div.innerHTML = `
          <p class="nombre-tipo">${p.tipo} de ${nombre}</p>
          <p class="detalle">${p.fecha} — $${p.monto.toLocaleString("es-CL")}</p>
          <div class="acciones">
            <button class="boton-aprobar">Aprobar</button>
            <button class="boton-rechazar">Rechazar</button>
          </div>
        `;
        const btnAprobar = div.querySelector(".boton-aprobar");
        const btnRechazar = div.querySelector(".boton-rechazar");
        btnAprobar.addEventListener("click", () => {
          btnAprobar.disabled = true;
          btnRechazar.disabled = true;
          procesar(p, "Aprobado");
        });
        btnRechazar.addEventListener("click", () => {
          btnAprobar.disabled = true;
          btnRechazar.disabled = true;
          procesar(p, "Rechazado");
        });
        contenedor.appendChild(div);
      }
    }

    async function cargarHistorialTasas() {
      const contenedor = document.getElementById("historialTasas");
      const snap = await get(ref(db, "tasas_periodo"));
      const datos = snap.val() || {};
      const periodos = Object.values(datos).sort((a, b) => (a.fecha_inicio < b.fecha_inicio ? 1 : -1));

      if (periodos.length === 0) {
        contenedor.innerHTML = '<p class="texto-suave">Aún no hay tasas publicadas.</p>';
        return;
      }

      contenedor.innerHTML = periodos
        .map((p) => {
          const clase = p.tasa_objetivo >= 0 ? "positiva" : "negativa";
          const signo = p.tasa_objetivo >= 0 ? "+" : "";
          return `
            <div class="fila">
              <span>${p.fecha_inicio} a ${p.fecha_fin}</span>
              <span class="cambio ${clase}">${signo}${(p.tasa_objetivo * 100).toFixed(1)}%</span>
            </div>
          `;
        })
        .join("");
    }

    async function procesar(p, nuevoEstado) {
      const snapActual = await get(ref(db, `movimientos/${p.uid}/${p.movId}`));
      if ((snapActual.val() || {}).estado !== "Pendiente") {
        await cargarPendientes();
        return;
      }

      if (nuevoEstado === "Aprobado") {
        const cuotaHoy = await valorCuotaHoy();
        const unidades = p.monto / cuotaHoy;
        const signo = p.tipo === "Aporte" ? 1 : -1;

        const snapUsuario = await get(ref(db, `usuarios/${p.uid}`));
        const actual = (snapUsuario.val() || {}).unidades_totales || 0;
        await update(ref(db, `usuarios/${p.uid}`), {
          unidades_totales: actual + signo * unidades,
        });
      }

      await update(ref(db, `movimientos/${p.uid}/${p.movId}`), {
        estado: nuevoEstado,
      });

      await cargarPendientes();
      await cargarResumen();
    }

    document.getElementById("tasaForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const dias = parseInt(document.getElementById("tipoPeriodo").value, 10);
      const tasaPorc = parseFloat(document.getElementById("tasaObjetivo").value);
      const tasaObjetivo = tasaPorc / 100;
      const resultado = document.getElementById("resultado");

      try {
        const snap = await get(ref(db, "tasas_periodo"));
        const periodos = snap.val() ? Object.values(snap.val()) : [];

        let valorInicial = 1000;
        let fechaInicio = new Date();

        if (periodos.length > 0) {
          const ultimo = periodos.reduce((a, b) =>
            new Date(a.fecha_fin) > new Date(b.fecha_fin) ? a : b
          );
          valorInicial = valorCuotaEnFecha(ultimo, new Date(ultimo.fecha_fin));
          fechaInicio = new Date(new Date(ultimo.fecha_fin).getTime() + 86400000);
        }

        const fechaFin = new Date(fechaInicio.getTime() + (dias - 1) * 86400000);
        const factores = generarFactoresDiarios(tasaObjetivo, dias);

        const nuevoPeriodo = {
          fecha_inicio: fechaInicio.toISOString().slice(0, 10),
          fecha_fin: fechaFin.toISOString().slice(0, 10),
          tipo: dias === 30 ? "Mensual" : "Quincenal",
          tasa_objetivo: tasaObjetivo,
          valor_inicial: valorInicial,
          factores,
          publicado_por: usuarioActual.uid,
        };

        const nuevaRef = push(ref(db, "tasas_periodo"));
        await set(nuevaRef, nuevoPeriodo);

        resultado.textContent = `¡Publicado! Del ${nuevoPeriodo.fecha_inicio} al ${nuevoPeriodo.fecha_fin}, empezando en $${Math.round(valorInicial).toLocaleString("es-CL")}.`;
        resultado.className = "resultado-msg exito";
        e.target.reset();
        await cargarHistorialTasas();
      } catch (err) {
        resultado.textContent = `Error: ${err.message}`;
        resultado.className = "resultado-msg error";
      }
    });
    document.getElementById("btnCerrarSesion").addEventListener("click", async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
