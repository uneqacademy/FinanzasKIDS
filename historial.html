<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="format-detection" content="telephone=no" />
  <title>Historial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div style="text-align:right; margin-bottom: 10px;">
    <a href="#" id="btnCerrarSesion" class="link-muted">Cerrar sesión</a>
  </div>
  <p class="saludo" id="quien">Cargando...</p>

  <div class="tabs">
    <a href="inicio.html" class="tab">Inicio</a>
    <a href="historial.html" class="tab activo">Historial</a>
  </div>

  <div class="chips">
    <button class="chip activo" id="btnAportes">Aportes</button>
    <button class="chip" id="btnRetiros">Retiros</button>
  </div>

  <div class="panel">
    <div id="lista">Cargando...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmbQvh1aP6HJ4cIfng_L0auwIq-4a1awA",
      authDomain: "finanzaskidsgb.firebaseapp.com",
      databaseURL: "https://finanzaskidsgb-default-rtdb.firebaseio.com",
      projectId: "finanzaskidsgb",
      storageBucket: "finanzaskidsgb.firebasestorage.app",
      messagingSenderId: "847408719363",
      appId: "1:847408719363:web:d9301376fef801e2259036"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let movimientos = [];
    let filtroActual = "Aporte";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      const snapNombre = await get(ref(db, `usuarios/${user.uid}/nombre`));
      document.getElementById("quien").textContent = `¡Hola ${snapNombre.val() || user.email}!`;

      const snap = await get(ref(db, `movimientos/${user.uid}`));
      const datos = snap.val() || {};
      movimientos = Object.values(datos).sort((a, b) => (a.fecha < b.fecha ? 1 : -1));

      render();
    });

    function render() {
      const lista = document.getElementById("lista");
      const filtrados = movimientos.filter((m) => m.tipo === filtroActual);

      if (filtrados.length === 0) {
        lista.innerHTML = `<p class="texto-suave">No hay ${filtroActual === "Aporte" ? "aportes" : "retiros"} registrados.</p>`;
        return;
      }

      lista.innerHTML = filtrados
        .map((m) => {
          const clase = m.estado === "Aprobado" ? "aprobado" : m.estado === "Pendiente" ? "pendiente" : "rechazado";
          return `
            <div class="fila">
              <span>${m.fecha}</span>
              <span style="display:flex; align-items:center; gap:10px;">
                <strong>$${m.monto.toLocaleString("es-CL")}</strong>
                <span class="pill ${clase}">${m.estado}</span>
              </span>
            </div>
          `;
        })
        .join("");
    }

    document.getElementById("btnAportes").addEventListener("click", () => {
      filtroActual = "Aporte";
      document.getElementById("btnAportes").classList.add("activo");
      document.getElementById("btnRetiros").classList.remove("activo");
      render();
    });
    document.getElementById("btnRetiros").addEventListener("click", () => {
      filtroActual = "Retiro";
      document.getElementById("btnRetiros").classList.add("activo");
      document.getElementById("btnAportes").classList.remove("activo");
      render();
    });
    document.getElementById("btnCerrarSesion").addEventListener("click", async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
